[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-runner"
version = "0.1.0"
description = "Public-safe orchestration kernel for a multi-repository project ecosystem"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.scripts]
project-runner = "runner.cli:entrypoint"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["runner"]
