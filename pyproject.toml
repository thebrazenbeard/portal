[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-runner"
version = "0.1.0"
description = "P.O.R.T.A.L. portfolio coordination built on the governed Project Runner execution kernel"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.scripts]
project-runner = "runner.cli:entrypoint"
portal = "portal.cli:entrypoint"
portal-desktop = "portal.desktop_app:main"
portal-desktop-authority-key = "portal.desktop_keyring:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["runner", "portal"]
