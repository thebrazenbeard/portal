[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-coordinator"
version = "0.2.0"
description = "PORTAL portfolio coordination with its privately namespaced execution kernel"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.scripts]
portal = "portal.cli:entrypoint"
portal-desktop = "portal.desktop_app:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["portal", "portal._runner"]

[tool.setuptools.package-data]
portal = [
  "assets/*.png",
  "_data/registry/*.yaml",
  "_data/topology/*.yaml",
  "_data/portfolio/*.json",
  "_data/schemas/*.json",
]
