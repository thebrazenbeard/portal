projects:
- id: project-runner
  name: Project Runner
  visibility: public
  repositories:
  - thebrazenbeard/project-runner
  capabilities:
  - read
  - analyze
  - propose
  - create_branch
  - write_branch
  - open_pr
  - comment
  - request_review
  - merge
  execution_targets:
  - work_type: INSPECT
    repository: thebrazenbeard/project-runner
    ref: main
  - work_type: REREVIEW
    repository: thebrazenbeard/project-runner
    ref: main
    worker_id: project-runner-reference-read-worker
    worker_route: RUNNER_ACTION_PULL
